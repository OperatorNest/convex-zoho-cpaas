name: Bug report
description: Report a reproducible component or client failure.
labels: ["type:bug", "status:needs-triage"]
body:
  - type: input
    id: package_version
    attributes:
      label: Package version
      placeholder: Package version or unreleased commit SHA
    validations:
      required: true
  - type: input
    id: convex_version
    attributes:
      label: Convex version
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Convex runtime
      options: [Convex cloud, Self-hosted, Local backend]
    validations:
      required: true
  - type: dropdown
    id: zoho_region
    attributes:
      label: Zoho CPaaS region
      description: Select the affected region.
      options: [US, EU, IN, AU, JP, CN, Not applicable]
    validations:
      required: false
  - type: dropdown
    id: zoho_channel
    attributes:
      label: Channel
      description: Select the affected channel.
      options: [Email, SMS, WhatsApp, Not applicable]
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide code or steps without credentials or personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Optional logs
      description: Do not include credentials, API or webhook tokens, recipient addresses, message contents, phone numbers, or other personal data.
    validations:
      required: false
